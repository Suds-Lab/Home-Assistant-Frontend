# Home Assistant add-on manifest for "My Home" (Python / Flask).
# Docs: https://developers.home-assistant.io/docs/add-ons/configuration
name: My Home
version: "1.6.0"
slug: my_home
description: Per-user device dashboard for your Home Assistant
url: https://github.com/Suds-Lab/Home-Assistant-Frontend
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386

# The "My Home" sidebar tab (Ingress) is the ADMIN MANAGEMENT UI - manage users
# and assign their devices. Ingress routes it through HA's own auth, and it's
# admin-only (panel_admin defaults to true), like the Terminal add-on.
ingress: true
ingress_port: 4000
panel_icon: mdi:home-lightbulb
panel_title: My Home

# The household-facing device dashboard is published here. Members open it at
# http://<home-assistant>:8099 and log in with the app account an admin created.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: My Home user dashboard (per-user device control)

# Grants a Supervisor token + proxied access to the core API at
# http://supervisor/core/api - no long-lived token needed.
homeassistant_api: true

# Users are NOT configured here - manage them in the app's "Manage users"
# screen (the sidebar tab), which is the single source of truth (/data).
# A default admin (alice / changeme) is seeded on first run; change it there.
options:
  app_name: My Home
  jwt_secret: change-me-to-a-long-random-string
schema:
  app_name: str?
  jwt_secret: str
