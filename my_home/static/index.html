<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>My Home</title>
    <!-- Relative href so styles resolve under any path prefix (Ingress). -->
    <link rel="stylesheet" href="./styles.css" />

    <!-- PWA: installable, full-screen, native-feeling on phones.
         use-credentials so the manifest loads behind a cookie auth gateway
         (Cloudflare Access / Authelia / basic-auth) - the default no-credentials
         manifest fetch gets blocked there and silently breaks install. -->
    <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Home" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon-192.png" />

    <!-- React + Babel vendored locally (no npm, no build step, no CDN/internet
         needed at runtime). Babel transforms app.jsx in the browser. -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="./app.jsx" data-presets="react"></script>
  </body>
</html>
